name: live provider verification
on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider to verify (at most 4 calls each)
        type: choice
        options: [openai, dart, all]
        default: openai
permissions:
  contents: read
concurrency:
  group: live-provider-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify real API calls
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          PROVIDER: ${{ inputs.provider }}
        run: python -m quarterguard.live_verification --provider "$PROVIDER"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-provider-verification
          path: work/live-verification.json
          if-no-files-found: error
          retention-days: 30
